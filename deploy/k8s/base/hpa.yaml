# CPU is a proxy: a replica spends most of a real-model answer waiting on the model, so watch the
# p95 of /api/chat too (docs/PERFORMANCE.md) before trusting this to keep latency down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loopdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loopdesk
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
