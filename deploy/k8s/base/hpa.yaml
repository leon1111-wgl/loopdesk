# CPU alone under-reacts: a replica waiting on the model is full at 3% CPU (N-158, docs/PERFORMANCE.md).
# With Prometheus and Prometheus Adapter (or KEDA) in the cluster, apply overlays/inflight-autoscaling
# instead, which also scales on answers in flight. It is not in the base on purpose: an HPA with a
# metric it cannot read still scales up on the others but never scales down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loopdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loopdesk
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
