---
# Deletes trace details and masks texts past the retention period.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loopdesk-retention
  labels:
    app.kubernetes.io/name: loopdesk
    app.kubernetes.io/component: retention
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loopdesk
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: loopdesk
              command: ["python", "-m", "app.ops.retention", "--days", "90"]
              envFrom:
                - configMapRef:
                    name: loopdesk-config
                - secretRef:
                    name: loopdesk-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
