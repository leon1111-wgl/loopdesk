# Settings that are not secret. The secret ones (database URL, JWT secret, audit key, model key) come
# from the Secret "loopdesk-secrets", which this directory does not create: see docs/DEPLOYMENT.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loopdesk-config
data:
  LOOPDESK_SEED_DEMO: "0"            # production: no demo tenants or accounts
  LOOPDESK_AUTO_MIGRATE: "0"         # the Job loopdesk-migrate migrates; replicas wait for it
  LOOPDESK_LOG_FORMAT: json
  LOOPDESK_CORS_ORIGINS: https://support.example.com
  # Any OpenAI-compatible endpoint; with LOOPDESK_LLM_API_KEY in the Secret this selects it.
  LOOPDESK_LLM_BASE_URL: https://api.deepseek.com/v1
  LOOPDESK_LLM_MODEL: replace-with-the-model-id
  LOOPDESK_RUN_DEADLINE_SECONDS: "45"
  # Proxies whose X-Forwarded-For uvicorn believes, so the login limit counts each customer's IP: your
  # cluster's pod network, which the ingress controller connects from (set your own CIDR). uvicorn takes
  # the rightmost address not in this list, the one the controller appended, so clients outside the
  # cluster cannot pick their IP; a pod inside it that connects directly could. Narrow this to the
  # controller's pods, or let only the controller reach these pods (a NetworkPolicy), where you can.
  # Not 127.0.0.1 behind an ingress: every customer would share the controller's address, and anyone
  # sending 30 wrong passwords a minute would lock everyone out. Never "*".
  FORWARDED_ALLOW_IPS: 10.0.0.0/8
