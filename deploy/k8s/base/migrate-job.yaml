# Runs the Alembic migrations once per release. A Job is immutable: before applying a new image,
# kubectl -n loopdesk delete job loopdesk-migrate --ignore-not-found  (docs/DEPLOYMENT.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: loopdesk-migrate
  labels:
    app.kubernetes.io/name: loopdesk
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6  # the database may still be starting
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loopdesk
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: loopdesk
          command: ["python", "-m", "app.ops.migrate"]
          envFrom:
            - configMapRef:
                name: loopdesk-config
            - secretRef:
                name: loopdesk-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
