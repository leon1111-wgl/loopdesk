name: Demo site (GitHub Pages)

# The static demo at https://leon1111-wgl.github.io/loopdesk/ : the real console in replay mode.
# Its data is recorded from the real backend (SYNTHETIC accounts and orders;
# backend/app/ops/record_demo.py). The answers come from the real-model recording committed by
# demo-record.yml (demo/real-model/fixtures.json) while it still covers this commit's console;
# otherwise, and in forks without one, from the offline model, recorded here on every deployment.
# The banner says which model answered. Nothing in the demo talks to a server.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Record and build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the console in replay mode
        working-directory: frontend
        env:
          VITE_DEMO: "1"
          VITE_BASE: /loopdesk/
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html  # deep links such as /loopdesk/approvals
      - name: Record the demo from the real backend (offline model, synthetic data)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.ops.record_demo ../offline-fixtures.json
      - name: Replay the real-model recording if it covers this console, else the offline one
        working-directory: backend
        run: |
          python -m app.ops.demo_fixtures --offline ../offline-fixtures.json \
            --real ../demo/real-model/fixtures.json --out ../frontend/dist/demo/fixtures.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No key or login token in what is published
        working-directory: backend
        run: python -m app.ops.leak_check ../frontend/dist/demo/fixtures.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
