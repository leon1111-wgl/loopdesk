name: Red team

# Automated red teaming of LoopDesk with the real model (docs/EVALUATION.md, 红队测试). Measure only:
# nothing here gates a merge, and generated attacks never go into the test suite.
#
# The backend starts here with seeded demo data and the relay model (both tiers). promptfoo (pinned)
# generates fresh Chinese attacks for each tenant from its purpose and policies, runs them through the
# chat API as the tenant's customer (backend/app/redteam/target.py), lets the jailbreak and crescendo
# strategies escalate them, and grades every answer. The same relay model writes, drives and grades the
# attacks: a grader from another model family would be better, and only one is available. A fixed
# 30-case trend set (backend/redteam/trend_set.json, never regenerated) is replayed for the trend.
#
# `replay` re-runs the attacks generated by an earlier run (its `redteam` artifact) instead of new ones:
# the same attacks before and after a fix.

on:
  workflow_dispatch:
    inputs:
      tenants:
        description: "Tenants, comma-separated"
        default: "leon,echo,iris"
        required: false
      tests_per_plugin:
        description: "Attacks generated per plugin (the cost cap; strategies multiply it by 3)"
        default: "2"
        required: false
      strategies:
        description: "Strategies on top of the plain attacks (empty: plain only)"
        default: "jailbreak,crescendo"
        required: false
      fresh:
        description: "Generate and run fresh attacks"
        type: boolean
        default: true
      trend:
        description: "Replay the fixed trend set"
        type: boolean
        default: true
      replay:
        description: "Run id whose generated attacks to replay instead of generating new ones"
        default: ""
        required: false
      max_calls:
        description: "Budget: chat requests for the whole run"
        default: "1500"
        required: false

permissions:
  contents: read
  actions: read  # replay downloads an earlier run's artifact

concurrency:
  group: redteam
  cancel-in-progress: false

jobs:
  redteam:
    name: Red team (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: backend
    env:
      PROMPTFOO_VERSION: "0.124.1"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_DISABLE_SHARING: "1"
      # Every plugin is generated by our relay; promptfoo's hosted generation would write the attacks
      # with another model and send it the system description.
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_PYTHON: python
      LOOPDESK_LLM_MODEL: ${{ vars.LOOPDESK_LLM_MODEL }}
      LOOPDESK_LLM_BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
      LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
      # promptfoo's openai:chat provider reads the base URL from here, so it is never written in a config
      OPENAI_BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
      # the backend under attack
      LOOPDESK_LLM_PROVIDER: openai_compat
      LOOPDESK_LLM_MODEL_STRONG: ${{ vars.LOOPDESK_LLM_MODEL }}
      LOOPDESK_LLM_MODEL_FAST: ${{ vars.LOOPDESK_LLM_MODEL }}
      LOOPDESK_LOG_FORMAT: text
      OUT: ${{ github.workspace }}/out/redteam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install --global "promptfoo@${PROMPTFOO_VERSION}"
          promptfoo --version
      - name: Check the model answers (a wrong key or URL fails here, not after an hour)
        run: python -m app.ops.llm_check
      - name: Download the attacks to replay
        if: inputs.replay != ''
        uses: actions/download-artifact@v4
        with:
          name: redteam
          run-id: ${{ inputs.replay }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay
      - name: Red team
        env:
          TENANTS: ${{ inputs.tenants }}
          TESTS_PER_PLUGIN: ${{ inputs.tests_per_plugin }}
          STRATEGIES: ${{ inputs.strategies }}
          FRESH: ${{ inputs.fresh }}
          TREND: ${{ inputs.trend }}
          MAX_CALLS: ${{ inputs.max_calls }}
          REPLAY_DIR: ${{ inputs.replay != '' && format('{0}/replay', runner.temp) || '' }}
        run: bash redteam/run.sh
      - name: Report (attack success per tenant and plugin, transcripts, tokens)
        if: always()
        run: |
          python -m app.redteam.report summarize "$OUT" --markdown "$OUT/report.md" --json "$OUT/summary.json"
          sed '/^## Successful attacks/,$d' "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the artifact for the key; hide the relay URL
        id: scrub
        if: always()
        run: python -m app.redteam.report scrub "$OUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: redteam
          path: out/redteam
          retention-days: 30
