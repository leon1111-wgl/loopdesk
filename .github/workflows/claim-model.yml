name: Claim classifier (train and measure)

# Fine-tunes compact Chinese models to tell claims from framing (backend/app/ml/claim_model.py), on a CPU
# runner: training data are the blind-labelled dev sentences of the recorded real-model answers plus
# synthetic sentences; the held-out cases are used once, for the comparison with the rules. Each job
# uploads metrics.json; the encoders also upload the int8 ONNX model the app loads with
# LOOPDESK_CLAIM_CLASSIFIER=model and LOOPDESK_CLAIM_MODEL_DIR, and replay the answer check with it.
# Nothing here runs on a developer machine. Data is SYNTHETIC.
on:
  workflow_dispatch:
    inputs:
      lora:
        description: Also LoRA-tune Qwen2.5-0.5B (slow on CPU; torch only, not exported)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  encoder:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: hfl/rbt3, lr: "5e-5", epochs: "5", slug: rbt3}
          - {model: bert-base-chinese, lr: "3e-5", epochs: "4", slug: bert-base-chinese}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-train.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.slug }}
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-train.txt
      - name: Train, pick the epoch and threshold on validation, test once on held-out
        run: python -m app.ml.claim_model --model "${{ matrix.model }}" --lr "${{ matrix.lr }}" --epochs "${{ matrix.epochs }}" --out claim-model
      - name: The answer check with the model as its claim classifier (replay)
        run: |
          python -m app.evals.trust --mode tiered --classifier model --model-dir claim-model --report claim-model/trust-model.json | tee claim-model/trust-model.txt
          python -m app.evals.trust --mode tiered --report claim-model/trust-rules.json | tee claim-model/trust-rules.txt
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("claim-model/metrics.json"))
          print(f"### {m['model']} ({m['train_seconds']} s training, best epoch {m['best']['epoch']}, threshold {m['best']['threshold']})\n")
          print("| held-out | precision | recall | F1 |\n|---|---|---|---|")
          for k, v in m["heldout"].items():
              print(f"| {k} | {v['precision']} | {v['recall']} | {v['f1']} |")
          print("\n| latency, batch 1, 1 CPU thread | p50 ms | p95 ms |\n|---|---|---|")
          for k, v in m["latency_batch1_cpu_1thread"].items():
              print(f"| {k} | {v['p50_ms']} | {v['p95_ms']} |")
          print(f"\n{m['verdict']}; int8 model {m.get('onnx_int8_mb')} MB")
          PY
          { echo '```'; cat claim-model/trust-model.txt claim-model/trust-rules.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: claim-model-${{ matrix.slug }}
          path: |
            backend/claim-model/model.onnx
            backend/claim-model/tokenizer.json
            backend/claim-model/config.json
            backend/claim-model/metrics.json
            backend/claim-model/trust-*.json
            backend/claim-model/trust-*.txt

  lora:
    name: Qwen2.5-0.5B LoRA
    if: inputs.lora
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-train.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-train.txt
      - run: python -m app.ml.claim_model --model Qwen/Qwen2.5-0.5B --lora --lr 2e-4 --epochs 2 --batch 16 --out claim-lora
      - uses: actions/upload-artifact@v4
        with:
          name: claim-model-qwen2.5-0.5b-lora
          path: backend/claim-lora/metrics.json
