name: Real-model eval

# Every tenant's regression gate and the hard set, answered by the configured real model, k times each
# (one real-model run is not a measurement: docs/EVALUATION.md). The reports are uploaded as artifacts
# and the summary table (mean and range, pass^k, flaky cases, tokens, estimated cost) goes into the job
# summary. The same run brings up `docker compose` with the real model and asks it one question, which
# checks the README's "run it yourself" commands end to end.
#
# Needs the secret LOOPDESK_LLM_API_KEY and the repository variables LOOPDESK_LLM_BASE_URL and
# LOOPDESK_LLM_MODEL (any OpenAI-compatible endpoint). A fork without them skips every job. The key is
# passed only to the steps that call the model and is masked like every secret; the address and the
# model are variables and show in step headers. Every uploaded file is scanned for the key, the
# gateway's host and login tokens first (app.ops.leak_check). Data is SYNTHETIC.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Runs per suite
        default: "3"
      only:
        description: "tenant/suite pairs to run, comma-separated (e.g. leon/default,leon/hard), or all"
        default: all
      price_input:
        description: CNY per 1M input tokens, for the cost estimate (list price, cache misses)
        default: "2"
      price_output:
        description: CNY per 1M output tokens, for the cost estimate
        default: "8"
      verifier:
        description: "Answer check: lexical (default) or tiered (FIX / one REASK / handoff, judge on disagreements)"
        type: choice
        options: [lexical, tiered]
        default: lexical
      stack:
        description: Also bring up docker compose with the real model and ask it one question
        type: boolean
        default: true
  # Weekly, off until the cost of a run is known (the job summary of a manual run says it):
  # schedule:
  #   - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  plan:
    name: Find the suites
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.key.outputs.configured }}
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        env:
          KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
          BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
          MODEL: ${{ vars.LOOPDESK_LLM_MODEL }}
        run: |
          if [ -n "$KEY" ] && [ -n "$BASE_URL" ] && [ -n "$MODEL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No LOOPDESK_LLM_API_KEY secret or LOOPDESK_LLM_BASE_URL / LOOPDESK_LLM_MODEL variables (a fork?): nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: suites
        env:
          TRIALS: ${{ inputs.trials || '3' }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          # Each tenant's gate is evals/<tenant>_default.jsonl; a hard set is evals/<tenant>_hard.jsonl.
          pairs = [(p.name.rsplit("_", 1)[0], p.stem.rsplit("_", 1)[1])
                   for p in sorted(pathlib.Path("backend/evals").glob("*_*.jsonl"))
                   if p.stem.rsplit("_", 1)[1] in ("default", "hard")]
          only = os.environ["ONLY"].strip()
          if only != "all":
              wanted = {tuple(x.strip().split("/")) for x in only.split(",")}
              pairs = [p for p in pairs if p in wanted]
          trials = max(1, min(int(os.environ["TRIALS"]), 10))
          include = [{"tenant": t, "suite": s, "trial": n} for t, s in pairs for n in range(1, trials + 1)]
          print("matrix=" + json.dumps({"include": include}))
          EOF

  eval:
    name: ${{ matrix.tenant }}/${{ matrix.suite }} trial ${{ matrix.trial }}
    needs: plan
    if: needs.plan.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: backend
    env:
      LOOPDESK_LLM_BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
      LOOPDESK_LLM_MODEL: ${{ vars.LOOPDESK_LLM_MODEL }}
      PRICE_INPUT: ${{ inputs.price_input || '2' }}
      PRICE_OUTPUT: ${{ inputs.price_output || '8' }}
      LOOPDESK_VERIFIER: ${{ inputs.verifier || 'lexical' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the model answers
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: python -m app.ops.llm_check
      - name: Run the suite
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: |
          export LOOPDESK_PRICES="{\"$LOOPDESK_LLM_MODEL\": [$PRICE_INPUT, $PRICE_OUTPUT]}"
          mkdir -p reports
          python -m app.evals.cli --fresh --tenant "${{ matrix.tenant }}" --suite "${{ matrix.suite }}" \
            --report "reports/${{ matrix.tenant }}__${{ matrix.suite }}__t${{ matrix.trial }}.json"
      - name: No key, gateway address or login token in what is uploaded
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: python -m app.ops.leak_check reports/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-eval-${{ matrix.tenant }}-${{ matrix.suite }}-t${{ matrix.trial }}
          path: backend/reports/*.json

  summary:
    name: Summary table
    needs: [plan, eval]
    if: always() && needs.plan.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: real-eval-*
          path: backend/reports
          merge-multiple: true
      - name: Summarise
        env:
          PRICES: ${{ inputs.price_input || '2' }},${{ inputs.price_output || '8' }}
        run: |
          python -m app.evals.summarize reports --json reports/summary.json --markdown reports/summary.md \
            --commit "$GITHUB_SHA" --prices "$PRICES" > /dev/null
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: real-eval-summary
          path: |
            backend/reports/summary.json
            backend/reports/summary.md

  stack:
    name: docker compose up with the real model (the README's commands)
    needs: plan
    if: needs.plan.outputs.configured == 'true' && (inputs.stack || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write the three-line .env
        env:
          BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
          KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
          MODEL: ${{ vars.LOOPDESK_LLM_MODEL }}
        run: |
          umask 077
          printf 'LOOPDESK_LLM_BASE_URL=%s\nLOOPDESK_LLM_API_KEY=%s\nLOOPDESK_LLM_MODEL=%s\n' "$BASE_URL" "$KEY" "$MODEL" > .env
      - name: docker compose up -d --build --wait
        run: |
          began=$(date +%s)
          docker compose up -d --build --wait --wait-timeout 300
          echo "Stack built and ready in $(( $(date +%s) - began )) s." >> "$GITHUB_STEP_SUMMARY"
      - name: The model check inside the container
        run: docker compose exec -T app python -m app.ops.llm_check
      - name: Ready, healthy, one answer from the real model
        run: |
          python3 backend/app/ops/smoke.py http://localhost:8000 --provider openai_compat | tee smoke.txt
          { echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200 app
      - if: always()
        run: |
          docker compose down -v
          rm -f .env
