name: Answer-check eval (recorded answers, real judge)

# Replays the 937 recorded real-model answers and the planted wrong sentences (backend/evals/trust/)
# through the answer check: the lexical check (before), the tiered check on rules only, and the tiered
# check with the configured real model judging only the claims the cheap tiers disagree on. No agent
# model is called again; only the judge is. Reports and the job summary give false fails, misses,
# judge calls and judge latency (docs/EVALUATION.md, "可信回答").
#
# Needs the secret LOOPDESK_LLM_API_KEY and the variables LOOPDESK_LLM_BASE_URL / LOOPDESK_LLM_MODEL
# (the same as real-model-eval.yml). Without them only the offline replays run. Data is SYNTHETIC.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Judge calls in parallel
        default: "6"
      splits:
        description: Splits to replay (dev, heldout, all)
        default: dev,heldout,all

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      LOOPDESK_LLM_BASE_URL: ${{ vars.LOOPDESK_LLM_BASE_URL }}
      LOOPDESK_LLM_MODEL: ${{ vars.LOOPDESK_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline replays (no model)
        run: |
          mkdir -p reports
          python -m app.evals.trust --mode lexical --split "${{ inputs.splits }}" --report reports/trust-lexical.json | tee reports/offline.txt
          python -m app.evals.trust --mode tiered --split "${{ inputs.splits }}" --report reports/trust-rules.json | tee -a reports/offline.txt
      - id: key
        env:
          KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: if [ -n "$KEY" ] && [ -n "$LOOPDESK_LLM_BASE_URL" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the model answers
        if: steps.key.outputs.configured == 'true'
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: python -m app.ops.llm_check
      - name: Tiered check, the real model judging disagreements
        if: steps.key.outputs.configured == 'true'
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: |
          python -m app.evals.trust --mode tiered --judge --workers "${{ inputs.workers }}" --split "${{ inputs.splits }}" \
            --report reports/trust-judge.json --show-missed | tee reports/judge.txt
      - name: No key, gateway address or login token in what is uploaded
        env:
          LOOPDESK_LLM_API_KEY: ${{ secrets.LOOPDESK_LLM_API_KEY }}
        run: python -m app.ops.leak_check reports/*.json reports/*.txt
      - name: Summary
        run: |
          { echo '```'; cat reports/offline.txt; [ -f reports/judge.txt ] && cat reports/judge.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trust-eval
          path: backend/reports/
