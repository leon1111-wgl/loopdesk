name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + eval gate (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Tests again with buffered trace writes (the PostgreSQL default)
        run: pytest -q
        env:
          LOOPDESK_TEST_TRACE_WRITES: buffered
      - name: Regression eval gate (offline model, synthetic data)
        run: python -m app.evals.cli --fresh --gate 0.95 --report eval-report.json
      - name: Regression eval gate, second tenant (SaaS knowledge base)
        run: python -m app.evals.cli --fresh --tenant iris --gate 0.95 --report eval-report-iris.json
      - name: Regression eval gate, main demo tenant (music streaming, virtual orders)
        run: python -m app.evals.cli --fresh --tenant echo --gate 0.95 --report eval-report-echo.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report*.json

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loopdesk
          POSTGRES_PASSWORD: loopdesk
          POSTGRES_DB: loopdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LOOPDESK_TEST_DATABASE_URL: postgresql+psycopg://loopdesk:loopdesk@localhost:5432/loopdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - run: pytest -q

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end walkthroughs (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Customer, agent and admin paths against the real API
        working-directory: frontend
        run: pnpm e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    name: docker compose up + smoke check (offline model)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: The whole stack in one command, as the README says
        run: |
          began=$(date +%s)
          docker compose up -d --build --wait --wait-timeout 300
          echo "stack built and ready in $(( $(date +%s) - began )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ready, healthy, one answer from the offline model
        run: python3 backend/app/ops/smoke.py http://localhost:8000 --provider mock
      - name: The image can resolve tenant time zones
        run: docker run --rm loopdesk:local python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Shanghai'))"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - if: always()
        run: docker compose down -v

  k8s:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          base=https://github.com/yannh/kubeconform/releases/download/v0.6.7
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz" && curl -fsSLO "$base/CHECKSUMS"
          sha256sum -c --ignore-missing CHECKSUMS
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Render the base and every overlay, validate against the Kubernetes 1.31 schemas
        run: |
          for dir in deploy/k8s/base deploy/k8s/overlays/*/; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -kubernetes-version 1.31.0 -
          done
