name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + eval gate (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Tests again with buffered trace writes (the PostgreSQL default)
        run: pytest -q
        env:
          LOOPDESK_TEST_TRACE_WRITES: buffered
      - name: Regression eval gate (offline model, synthetic data)
        run: python -m app.evals.cli --fresh --gate 0.95 --report eval-report.json
      - name: Regression eval gate, second tenant (SaaS knowledge base)
        run: python -m app.evals.cli --fresh --tenant iris --gate 0.95 --report eval-report-iris.json
      - name: Regression eval gate, main demo tenant (music streaming, virtual orders)
        run: python -m app.evals.cli --fresh --tenant echo --gate 0.95 --report eval-report-echo.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report*.json

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loopdesk
          POSTGRES_PASSWORD: loopdesk
          POSTGRES_DB: loopdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LOOPDESK_TEST_DATABASE_URL: postgresql+psycopg://loopdesk:loopdesk@localhost:5432/loopdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - run: pytest -q

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end walkthroughs (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Customer, agent and admin paths against the real API
        working-directory: frontend
        run: pnpm e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loopdesk:ci .
      - name: The image can resolve tenant time zones
        run: docker run --rm loopdesk:ci python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Shanghai'))"
